complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 12
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 5

potential-bugs:
  UnsafeCallOnNullableType:
    active: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
      - 'androidx.compose.runtime.Composable'


